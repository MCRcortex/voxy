// -------- Metal native library (macOS Apple Silicon only) --------
// Builds libvoxy_metal.dylib via CMake and bundles it at
// resources/natives/macos-arm64/ so it is included in the jar and can be
// loaded by MetalNative.load() on M-series Macs. On other platforms or when
// the toolchain is missing, this task is skipped so the regular build still
// produces a working OpenGL-only jar.
tasks.register('buildMetalNative', Exec) {
    group = 'build'
    description = 'Builds libvoxy_metal.dylib (macOS Apple Silicon only)'

    def nativeDir = file("$projectDir/native/metal")
    def outputDir = file("$projectDir/src/main/resources/natives/macos-arm64")
    def output    = file("$outputDir/libvoxy_metal.dylib")

    inputs.dir file("$nativeDir/src")
    inputs.file file("$nativeDir/CMakeLists.txt")
    outputs.file output

    workingDir = nativeDir
    commandLine 'bash', 'build.sh', 'Release'

    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()
    def isMacArm = osName.contains('mac') && osArch.contains('aarch64')

    onlyIf {
        if (!isMacArm) {
            logger.lifecycle(">>> buildMetalNative: SKIPPED — host is ${osName}/${osArch}, not macOS aarch64")
            return false
        }
        logger.lifecycle(">>> buildMetalNative: RUNNING on ${osName}/${osArch}")
        return true
    }

    doFirst {
        outputDir.mkdirs()
    }

    // Do not fail the overall build if the native toolchain is unavailable;
    // the jar will simply ship without the dylib and Metal will fall back to GL.
    ignoreExitValue = true
    doLast {
        def result = executionResult.getOrNull()
        if (result == null) {
            logger.lifecycle(">>> buildMetalNative: not executed (no result)")
            return
        }
        if (result.exitValue != 0) {
            logger.warn(">>> buildMetalNative: FAILED (exit=${result.exitValue}). Jar will ship without libvoxy_metal.dylib; Metal will fall back to OpenGL.")
        } else if (!output.exists()) {
            logger.warn(">>> buildMetalNative: exit=0 but dylib NOT found at ${output}. Check native/metal/build.sh output.")
        } else {
            logger.lifecycle(">>> buildMetalNative: SUCCESS — ${output} (${output.length()} bytes)")
        }
    }
}

processResources {
    dependsOn tasks.named('buildMetalNative')
}

// -------- Shader compiler smoke test --------
// Runs me.cortex.voxy.tools.ShaderCompilerSmokeTest against the on-disk shader
// tree to validate that GLSL -> SPIRV -> MSL works for a representative slice
// of Voxy's shaders (incl. cmdgen.comp with injected runtime defines and
// hiz.comp with subgroup ops). Used to gate M1 progress before wiring the
// compiler into the Metal/Vulkan backends.
tasks.register('testShaderCompiler', JavaExec) {
    group = 'verification'
    description = 'Smoke-test RuntimeShaderCompiler against representative Voxy shaders.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.ShaderCompilerSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

// M3 verification: open a Metal render pass with clear-color load action and
// confirm the command buffer commits + completes. Requires macos-arm64 host
// with libvoxy_metal.dylib built (./gradlew buildMetalNative).
tasks.register('testMetalRender', JavaExec) {
    group = 'verification'
    description = 'Smoke-test MetalRenderBackend by issuing a clear-color render pass.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.MetalRenderBackendSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

// M9-prep verification: exercise VertexLayout + bindVertexBuffer + drawIndirect
// in a single render. Catches JNI signature regressions in the encoder API
// expansion before M9 migration starts hitting these paths.
tasks.register('testMetalVertexBuffer', JavaExec) {
    group = 'verification'
    description = 'Smoke-test vertex layout + bindVertexBuffer + drawIndirect on Metal.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.MetalVertexBufferSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

// Blocker 1 verification: MTLIndirectCommandBuffer + executeCommandsInBuffer.
// Builds a 2-slot ICB, populates slot 0 with an indexed triangle draw, then
// renders by encoding executeCommandsInBuffer: with a (location=0, length=1)
// range buffer. The Metal-side primitive MDICSectionRenderer needs to replace
// glMultiDrawElementsIndirectCountARB on the central terrain render path.
tasks.register('testMetalIcb', JavaExec) {
    group = 'verification'
    description = 'Smoke-test MTLIndirectCommandBuffer + executeCommandsInBuffer on Metal.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.MetalIcbSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

// M10 verification: allocate an IOSurface, wrap it as an MTLTexture, and
// confirm the JNI/lifetime plumbing is right. The GL-roundtrip half lives
// in a future smoke test that runs inside an active GL context (this one
// doesn't have one available); the Metal-side allocation is the structural
// prerequisite for the full MC↔Voxy compositing the bridge enables.
tasks.register('testIOSurfaceBridge', JavaExec) {
    group = 'verification'
    description = 'Smoke-test IOSurface-backed MTLTexture allocation on Metal.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.IOSurfaceBridgeSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
}

