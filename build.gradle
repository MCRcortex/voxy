// M4 Stage A: bootstrap MoltenVK via LWJGL Vulkan and enumerate the GPU.
// Tells us the loader/dylib path is wired correctly before we invest in the
// rest of VulkanRenderBackend.
tasks.register('testVulkanLoader', JavaExec) {
    group = 'verification'
    description = 'Smoke-test that MoltenVK loads through LWJGL Vulkan bindings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'me.cortex.voxy.tools.VulkanLoaderSmokeTest'
    workingDir = rootProject.projectDir
    standardOutput = System.out
    errorOutput = System.err
    def moltenVkIcd = file('/opt/homebrew/etc/vulkan/icd.d/MoltenVK_icd.json')
    if (moltenVkIcd.exists()) {
        environment 'VK_ICD_FILENAMES', moltenVkIcd.absolutePath
    }
}

