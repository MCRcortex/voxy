plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft
    }

    accessTransformers = [file('src/main/resources/META-INF/accesstransformer.cfg')]

    runs {
        client {
            client()
            systemProperty 'forge.logging.console.level', 'debug'
            programArguments '--username', 'Dev'
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            systemProperty 'forge.logging.console.level', 'debug'
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        data {
            data()
            programArguments '--mod', project.mod_id,
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            gameDirectory = project.file('run/data')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    // Expose sqlite-jdbc as a dependency that gets shaded/jarJar'd
    jarJarDep
}

dependencies {
    // SQLite for LOD section caching (server + client side)
    implementation('org.xerial:sqlite-jdbc:3.46.1.3')
    jarJar('org.xerial:sqlite-jdbc:[3.46.0,4.0.0)') {
        version { prefer '3.46.1.3' }
    }

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.deprecation = true
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Vendor'   : project.maven_group,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : project.maven_group,
        ])
    }
}

processResources {
    def props = [
        mod_id     : project.mod_id,
        mod_version: project.mod_version,
        mc_version : project.minecraft_version,
        nf_version : project.neoforge_version
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

