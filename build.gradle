def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    StringBuilder sodium_versions_builder = new StringBuilder("[");
    for (String ver : project.properties.getOrDefault("sodium_extra_allows","").split(" ")) {
        if (!ver.isBlank()) {
            sodium_versions_builder.append("\"=").append(ver).append("\", ");
        }
    }
    String current_sodium_version;
    if (project.hasProperty("sodium_version_modrinth")) {
        // Format is "mc<mcversion>-<sodiumversion>-<loader>", and <sodiumversion> can itself contain
        // dashes for prerelease tags (e.g. "mc26.2-0.9.1-beta.2-fabric" -> "0.9.1-beta.2"), so the
        // sodium version is everything between the first and last "-"-delimited segments, not just [1].
        def parts = project.properties.sodium_version_modrinth.split("-")
        current_sodium_version = parts[1..-2].join("-");
    } else {
        current_sodium_version = project.properties.sodium_version.split("-")[0];
    }
    //sodium_versions_builder.append("\"=").append(current_sodium_version).append("\"").append(", ");
    sodium_versions_builder.append("\">=").append(current_sodium_version).append("- <=").append(current_sodium_version).append("\"")
    sodium_versions_builder.append("]");
    var sodium_versions = sodium_versions_builder.toString();

    var allowed_mc_version = project.properties.minecraft_version.split("-")[0];
    allowed_mc_version = "[\">="+allowed_mc_version+"- <=" + allowed_mc_version + "\", \"~"+allowed_mc_version+"\"]";

    inputs.properties("version": version, "commit": hash, "buildtime": time, "allowed_sodium_versions": sodium_versions, "allowed_mc_version": allowed_mc_version)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time, "allowed_sodium_versions": sodium_versions, "allowed_mc_version": allowed_mc_version
    }
}

