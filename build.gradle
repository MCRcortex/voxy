plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"
    }
    mavenCentral()
}

configurations {
    rocksdbInternal
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

def gitCommitHash = {
    try {
        def result = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            ignoreExitValue = true
        }
        return result.result.get().exitValue == 0
                ? result.standardOutput.asText.get().trim()
                : '<UnknownCommit>'
    } catch (Exception ignored) {
        return '<UnknownCommit>'
    }
}

def buildtime = java.time.Instant.now().epochSecond.toString()

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            sodium_version_range   : sodium_version_range,
            commit                 : gitCommitHash(),
            buildtime              : buildtime
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    // Voxy's rendering integration depends on Sodium and its public configuration API.
    implementation "maven.modrinth:sodium:${sodium_version}"
    // The Modrinth NeoForge package wraps Sodium as a nested mod jar; compile against the unwrapped Maven artifact.
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${sodium_api_version}"
    implementation "net.caffeinemc:sodium-neoforge-api:${sodium_api_version}"

    // Optional compatibility APIs used by Voxy when these mods are present.
    compileOnly "maven.modrinth:iris:${iris_version}"
    compileOnly "maven.modrinth:lithium:${lithium_version}"
    compileOnly "maven.modrinth:vivecraft:${vivecraft_version}"

    // Libraries used by Voxy's storage backends and importers.
    jarJar(implementation('redis.clients:jedis:5.1.0')) {
        version { strictly '[5.1.0]'; prefer '5.1.0' }
    }
    if (project.findProperty('includeOtherArchs')?.toBoolean()) {
        jarJar(implementation('org.rocksdb:rocksdbjni:10.2.1')) {
            version { strictly '[10.2.1]'; prefer '10.2.1' }
        }
    } else {
        implementation('org.rocksdb:rocksdbjni:10.2.1')
        rocksdbInternal('org.rocksdb:rocksdbjni:10.2.1')
    }
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0')) {
        version { strictly '[2.12.0]'; prefer '2.12.0' }
    }
    jarJar(implementation('org.lz4:lz4-java:1.8.0')) {
        version { strictly '[1.8.0]'; prefer '1.8.0' }
    }
    jarJar(implementation('org.tukaani:xz:1.10')) {
        version { strictly '[1.10]'; prefer '1.10' }
    }
    jarJar(runtimeOnly('org.xerial:sqlite-jdbc:3.49.1.0')) {
        version { strictly '[3.49.1.0]'; prefer '3.49.1.0' }
    }

    // Voxy uses these LWJGL bindings for memory-mapped storage and compression.
    implementation platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")
    jarJar(implementation("org.lwjgl:lwjgl:${lwjgl_version}:unsafe")) {
        version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
    }
    jarJar(implementation("org.lwjgl:lwjgl-lmdb:${lwjgl_version}")) {
        version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
    }
    jarJar(implementation("org.lwjgl:lwjgl-zstd:${lwjgl_version}")) {
        version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
    }
    ['windows', 'linux'].each { os ->
        runtimeOnly("org.lwjgl:lwjgl:${lwjgl_version}:natives-${os}")
        jarJar(runtimeOnly("org.lwjgl:lwjgl-lmdb:${lwjgl_version}:natives-${os}")) {
            version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
        }
        jarJar(runtimeOnly("org.lwjgl:lwjgl-zstd:${lwjgl_version}:natives-${os}")) {
            version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
        }
    }

    if (project.findProperty('includeOtherArchs')?.toBoolean()) {
        ['linux-arm64'].each { os ->
            runtimeOnly("org.lwjgl:lwjgl:${lwjgl_version}:natives-${os}")
            jarJar(runtimeOnly("org.lwjgl:lwjgl-lmdb:${lwjgl_version}:natives-${os}")) {
                version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
            }
            jarJar(runtimeOnly("org.lwjgl:lwjgl-zstd:${lwjgl_version}:natives-${os}")) {
                version { strictly "[${lwjgl_version}]"; prefer lwjgl_version }
            }
        }
    }
}

if (!project.findProperty('includeOtherArchs')?.toBoolean()) {
    def makeExcludedRocksDB = tasks.register('makeExcludedRocksDB', Jar) {
        entryCompression = ZipEntryCompression.STORED
        from { zipTree(configurations.rocksdbInternal.singleFile) }
        archiveFileName.set(providers.provider { configurations.rocksdbInternal.singleFile.name })
        manifest {
            attributes('Automatic-Module-Name': 'org.rocksdb')
        }
        exclude { details ->
            def fileName = details.name
            if (fileName.endsWith('.jnilib')) {
                return true
            }
            if (!fileName.endsWith('.so')) {
                return false
            }
            return ['osx', 'linux32', 'musl', 's390x', 'riscv64', 'ppc64le', 'aarch64']
                    .any(fileName::contains)
        }
    }
    dependencies {
        jarJar files(makeExcludedRocksDB)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.deprecation = true
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Version': project.version,
                'Voxy-Commit': gitCommitHash()
        )
    }
    from('LICENSE.md') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}
