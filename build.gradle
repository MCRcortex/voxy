def smartDependency(String property, boolean runtime = false, String maven = null, boolean compile = true) {
    String ver;
    if (project.hasProperty("runtime."+property)) {
        ver = project["runtime."+property];
        runtime = true
    } else if (project.hasProperty("compileOnly."+property)) {
        ver = project["compileOnly."+property];
        runtime = false
    }  else {
        ver = project[property];
    }

    if (ver == null) {
        return null;
    }

    Object dep;
    if (ver.endsWith(".jar")) {
        //File type
        dep = file(ver)
    } else {//Asume mvn
        //Hack, default modrinth maven
        if (maven == null) {
            maven = "maven.modrinth:"+(property.split("_")[0])
        }

        dep = (maven!=null?(maven+":"):"")+ver;
    }
    dependencies {
        if (compile && runtime) {
            implementation(dep)
        } else {
            if (compile) {
                compileOnly(dep)
            } else {
                runtimeOnlyMsk(dep)
            }
        }
    }
    return ver
}

