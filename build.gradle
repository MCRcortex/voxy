plugins {
    id 'net.neoforged.moddev' version "2.0.42-beta"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def hasSodiumJar  = file('libs/sodium-neoforge-0.8.12-beta.2-mod.jar').exists()
def hasIrisJar    = file('libs/iris-neoforge-1.8.14-beta.1.jar').exists()

sourceSets {
    main {
        java {
            exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'
            exclude 'me/cortex/voxy/client/mixin/flashback/**'
            exclude 'me/cortex/voxy/commonImpl/mixin/chunky/**'
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinGlDebug.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinBlockableEventLoop.java'
            if (!hasIrisJar) {
                exclude 'me/cortex/voxy/client/mixin/iris/**'
                exclude 'me/cortex/voxy/client/iris/**'
                exclude 'me/cortex/voxy/client/core/util/IrisUtil.java'
                exclude 'me/cortex/voxy/client/core/RenderPipelineFactory.java'
                exclude 'me/cortex/voxy/client/core/RenderProperties.java'
                exclude 'me/cortex/voxy/client/core/IrisVoxyRenderPipeline.java'
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name "caffeinemcRepository"
                url "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    // Forgified Fabric API for NeoForge
    maven {
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }

    // Exclude leftover Fabric metadata from NeoForge build
    exclude 'voxy.accesswidener'
}

neoForge {
    version = project.neoforge_version

    // Validate access transformers at build time to catch invalid targets
    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = "2024.11.17"
    }
}

def modRuntimeOnlyMsk = {arg->}
if (!isInGHA) {
    modRuntimeOnlyMsk = { arg ->
        dependencies {
            modRuntimeOnly(arg)
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    implementation "net.neoforged:neoforge:${project.neoforge_version}"

    // Forgified Fabric API for compatibility (includes Fabric Loader API)
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_version}"

    //compile against the real sodium jar (modrinth artifact is a thin bootstrap)
    if (hasSodiumJar) {
        compileOnly files('libs/sodium-neoforge-0.8.12-beta.2-mod.jar')
    }

    //iris-neoforge 1.8.14 (1.8.x api is compatible with 1.8.8 target)
    if (hasIrisJar) {
        compileOnly files('libs/iris-neoforge-1.8.14-beta.1.jar')
    }

    implementation("maven.modrinth:lithium:mc1.21.1-0.15.1-neoforge")
    compileOnly("maven.modrinth:sodium-options-api:neoforge-1.21.1-1.0.10")
    compileOnly("maven.modrinth:reeses-sodium-options:mc1.21.1-2.2.0+neoforge")
}


def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    //withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

// mixin validation
task validateMixinConfig(type: Exec) {
    description = 'validate mixin registration and exclusions'
    group = 'verification'

    commandLine 'python3', 'scripts/validate_mixin_config.py'

    // Only run if script exists
    onlyIf {
        file('scripts/validate_mixin_config.py').exists()
    }
}

// validate @Inject/@Shadow targets
task validateMixinSignatures(type: Exec) {
    description = 'validate mixin targets against mc source'
    group = 'verification'

    commandLine 'python3', 'scripts/validate_mixin_targets.py'

    // Only run if script and MC sources exist
    onlyIf {
        file('scripts/validate_mixin_targets.py').exists() &&
        file('.reference/minecraft/1.21.1/decompiled').exists()
    }

    // Ignore failures if sources not available or script has issues (optional validation)
    ignoreExitValue = true
}

// validate mixin jsons match built jar
task validateMixins(type: Exec) {
    dependsOn jar

    description = 'validate mixin json configs against jar contents'
    group = 'verification'

    commandLine 'bash', 'scripts/validate_mixins.sh'

    // Only run if script exists
    onlyIf {
        file('scripts/validate_mixins.sh').exists()
    }
}

project.ext.lwjglVersion = "3.3.3"
project.ext.lwjglNatives = "natives-windows"

repositories {
    mavenCentral()
}

// Configuration to download LWJGL natives for repackaging
configurations {
    lwjglNativesRaw
}

dependencies {
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"
}

// extract native binaries from LWJGL native jars for bundling
def extractedNativesDir = layout.buildDirectory.dir("extracted-natives")

tasks.register('extractLwjglNatives') {
    description = 'extract native binaries from LWJGL native jars'
    group = 'build'

    inputs.files(configurations.lwjglNativesRaw)
    outputs.dir(extractedNativesDir)

    doLast {
        def outputDir = extractedNativesDir.get().asFile
        outputDir.mkdirs()

        configurations.lwjglNativesRaw.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def inputJar = artifact.file
            logger.lifecycle("Extracting natives from ${inputJar.name}")

            // Extract only native binaries (.dll, .so, .dylib)
            copy {
                from(zipTree(inputJar)) {
                    include '**/*.dll'
                    include '**/*.so'
                    include '**/*.dylib'
                    // Flatten directory structure - put all natives at root
                    eachFile { fcp ->
                        fcp.relativePath = new RelativePath(true, fcp.name)
                    }
                    includeEmptyDirs = false
                }
                into outputDir
            }
        }

        // List extracted files
        outputDir.listFiles()?.each { file ->
            logger.lifecycle("  Extracted: ${file.name}")
        }
    }
}

// bundle extracted natives at jar root so LWJGL can find them
tasks.named('jar') {
    dependsOn 'extractLwjglNatives'

    from(extractedNativesDir) {
        into ''
    }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"

    jarJar(implementation("org.lwjgl:lwjgl-lmdb:$lwjglVersion")) {
        version { strictly "[3.3.0,4.0.0)"; prefer "$lwjglVersion" }
    }
    jarJar(implementation("org.lwjgl:lwjgl-zstd:$lwjglVersion")) {
        version { strictly "[3.3.0,4.0.0)"; prefer "$lwjglVersion" }
    }
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux"
    additionalRuntimeClasspath "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"

    jarJar(implementation('org.rocksdb:rocksdbjni')) {
        version {
            strictly '[10.0.0, 11.0.0)'
            prefer '10.2.1'
        }
    }

    compileOnly 'org.lz4:lz4-java:1.8.0'
    jarJar(implementation('redis.clients:jedis:5.1.0')) {
        version {
            strictly '[5.0.0, 6.0.0)'
            prefer '5.1.0'
        }
    }
    jarJar(implementation('org.apache.commons:commons-pool2:2.12.0'))
    jarJar(implementation('org.tukaani:xz:1.10')) {
        version {
            strictly '[1.9, 2.0)'
            prefer '1.10'
        }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc:3.49.1.0')) {
        version {
            strictly '[3.40.0.0, 4.0.0.0)'
            prefer '3.49.1.0'
        }
    }
    //implementation 'org.rocksdb:rocksdbjni:8.10.0'
    //implementation 'redis.clients:jedis:5.1.0'
}

