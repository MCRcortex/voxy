plugins {
    id 'net.neoforged.moddev' version "2.0.42-beta"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Exclude optional integrations from compilation - not all available for NeoForge 1.21.1
// These can be re-enabled once NeoForge versions become available
sourceSets {
    main {
        java {
            // Iris shader integration
            exclude 'me/cortex/neovoxy/client/iris/**'
            exclude 'me/cortex/neovoxy/client/core/IrisNeoVoxyRenderPipeline.java'
            exclude 'me/cortex/neovoxy/client/core/util/IrisUtil.java'
            exclude 'me/cortex/neovoxy/client/mixin/iris/**'

            // Sodium config API (changed in Sodium 0.6.x)
            exclude 'me/cortex/neovoxy/client/config/SodiumConfigBuilder.java'
            exclude 'me/cortex/neovoxy/client/config/NeoVoxyConfigMenu.java'
            exclude 'me/cortex/neovoxy/client/config/IConfigPageSetter.java'

            // ModMenu integration (Fabric-only)
            exclude 'me/cortex/neovoxy/client/config/ModMenuIntegration.java'

            // Vivecraft VR integration - ViewportSelector now NeoForge-compatible
            // ViewportSelector no longer excluded

            // Flashback integration mixins
            exclude 'me/cortex/neovoxy/client/mixin/flashback/**'

            // Nvidium integration mixins
            exclude 'me/cortex/neovoxy/client/mixin/nvidium/**'

            // Debug screen integration (API changed in MC 1.21.1)
            exclude 'me/cortex/neovoxy/client/NeoVoxyDebugScreenEntry.java'
            exclude 'me/cortex/neovoxy/client/mixin/minecraft/MixinDebugScreenEntryList.java'

            // Sodium config integration mixin
            exclude 'me/cortex/neovoxy/client/mixin/sodium/MixinVideoSettingsScreen.java'

            // Blaze3D OpenGL debug mixin (GlDebug class not accessible in MC 1.21.1)
            exclude 'me/cortex/neovoxy/client/mixin/minecraft/MixinGlDebug.java'

            // MixinFogRenderer now compatible with MC 1.21.1 (rewritten to target net.minecraft.client.renderer.FogRenderer)

            // BlockableEventLoop mixin (isNonRecoverable method removed in MC 1.21.1 - Issue #2)
            exclude 'me/cortex/neovoxy/client/mixin/minecraft/MixinBlockableEventLoop.java'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name "caffeinemcRepository"
                url "https://maven.caffeinemc.net/snapshots"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}

configurations {
    sodiumOuter
}

def sodiumDevJar = layout.buildDirectory.file('generated/sodium-dev.jar')

tasks.register('extractSodiumDevJar') {
    inputs.files(configurations.sodiumOuter)
    outputs.file(sodiumDevJar)
    doLast {
        def nested = zipTree(configurations.sodiumOuter.singleFile).matching {
            include 'META-INF/jarjar/*sodium-neoforge*-mod.jar'
        }.singleFile
        def output = sodiumDevJar.get().asFile
        output.parentFile.mkdirs()
        output.bytes = nested.bytes
    }
}


def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version, "commit": hash, "buildtime": time
    }

}

neoForge {
    version = project.neoforge_version

    // Validate access transformers at build time to catch invalid targets
    // Temporarily disabled to debug build issue
    // validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        neovoxy {
            sourceSet sourceSets.main
        }
    }
}

def modRuntimeOnlyMsk = {arg->}
if (!isInGHA) {
    modRuntimeOnlyMsk = { arg ->
        dependencies {
            modRuntimeOnly(arg)
        }
    }
}

